<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材盘点 · 动态设计样板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px}main{width:min(1280px,100%);margin:auto}.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:top left}.controls{max-width:730px;display:flex;align-items:center;gap:20px;margin:12px auto 0;padding:16px 22px;border:1px solid #33353a;border-radius:22px;background:#1c1d20}button{color:#f4f4f5;background:#2b2d32;border:0;border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid #e9eaed;outline-offset:4px}input{min-width:60px;flex:1;accent-color:#eee}output{font-size:13px;color:#aaadb5;font-variant-numeric:tabular-nums;white-space:nowrap}.caption{font-size:13px;color:#aaadb5;text-align:center;margin-top:20px}@media(max-width:600px){body{padding:8px}.controls{gap:9px;padding:12px}button{padding:10px}.caption{line-height:1.6}}
</style></head>
<body><main><div class="viewport"><iframe src="index.html" title="素材盘点动态样板"></iframe></div><div class="controls"><button id="toggle" type="button">暂停</button><button id="restart" type="button">重播</button><input id="seek" aria-label="播放进度" type="range" min="0" max="6" step="0.01" value="0"><output id="time">0.0 / 6.0s</output></div><p class="caption">素材盘点 · 设计样板　/　24 份视频 + 36 份图片</p></main>
<script>
const frame=document.querySelector('iframe'),viewport=document.querySelector('.viewport'),seek=document.querySelector('#seek'),toggle=document.querySelector('#toggle'),time=document.querySelector('#time');
let timeline,playing=true,position=0,last;
function resize(){frame.style.transform=`scale(${viewport.clientWidth/1280})`;}
new ResizeObserver(resize).observe(viewport);resize();
function paint(){if(timeline)timeline.seek(position);seek.value=position;time.textContent=`${position.toFixed(1)} / 6.0s`;toggle.textContent=playing?'暂停':'播放';}
frame.addEventListener('load',()=>{timeline=frame.contentWindow.__timelines['material-summary'];paint();});
toggle.addEventListener('click',()=>{if(position>=6)position=0;playing=!playing;paint();});
document.querySelector('#restart').addEventListener('click',()=>{position=0;playing=true;paint();});
seek.addEventListener('input',()=>{playing=false;position=Number(seek.value);paint();});
function tick(now){if(last!==undefined&&playing&&timeline){position=Math.min(6,position+(now-last)/1000);if(position===6)playing=false;paint();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
