<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>素材盘点 · 动态设计样板</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111214;color:#f4f4f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px}main{width:min(1280px,100%);margin:auto}.viewport{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}iframe{position:absolute;left:0;top:0;width:1280px;height:720px;border:0;transform-origin:top left}.controls{max-width:730px;display:flex;align-items:center;gap:20px;margin:12px auto 0;padding:16px 22px;border:1px solid #33353a;border-radius:22px;background:#1c1d20}button{color:#f4f4f5;background:#2b2d32;border:0;border-radius:12px;padding:12px 18px;font:inherit;cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible{outline:2px solid #e9eaed;outline-offset:4px}input{min-width:60px;flex:1;accent-color:#eee}output{font-size:13px;color:#aaadb5;font-variant-numeric:tabular-nums;white-space:nowrap}.caption{font-size:13px;color:#aaadb5;text-align:center;margin-top:20px}@media(max-width:600px){body{padding:8px}.controls{gap:9px;padding:12px}button{padding:10px}.caption{line-height:1.6}}
</style></head>
<body><main>
<style>
.viewport{border-radius:20px;background-color:#313338;background-image:conic-gradient(#3e4046 25%,transparent 0 50%,#3e4046 0 75%,transparent 0);background-size:48px 48px}
.viewport[data-background="light"]{background-color:#e5e8ed;background-image:linear-gradient(125deg,transparent 38%,#b5bec9 38% 60%,transparent 60%);background-size:100% 100%}
.viewport[data-background="dark"]{background-color:#171d27;background-image:linear-gradient(125deg,transparent 38%,#344253 38% 60%,transparent 60%);background-size:100% 100%}
.viewport video{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#171d27}
.viewport[data-background="video"] video{display:block}
iframe{background:transparent}
.settings{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:18px 24px;margin:20px auto;max-width:1000px;font-size:14px;color:#c5c7ce}
.settings label{display:flex;align-items:center;gap:10px}.settings select,.file-label{background:#24262b;color:#f4f4f5;border:1px solid #42454d;border-radius:10px;padding:11px 14px;font:inherit;min-height:44px}.file-label{cursor:pointer}.settings input[type="range"]{width:116px;flex:none}.file-input{position:absolute;width:1px;height:1px;opacity:0}.file-label:focus-within{outline:2px solid #e9eaed;outline-offset:3px}.settings output{width:36px}.caption{line-height:1.7}.controls{margin-top:0}
@media(max-width:600px){.settings{gap:12px;font-size:12px}.settings label{gap:7px}.settings input[type="range"]{width:82px}.viewport{border-radius:10px}}
</style>
<div class="viewport" data-background="checker"><video id="footage" muted playsinline preload="metadata" aria-label="本地背景视频"></video><iframe src="index.html" title="素材盘点动态样板"></iframe></div>
<div class="settings">
  <label>预览背景<select id="background" aria-label="预览背景"><option value="checker">透明棋盘格</option><option value="light">明亮背景</option><option value="dark">深色背景</option><option value="video" disabled>本地视频</option></select></label>
  <label class="file-label">选择本地视频<input class="file-input" id="video-file" aria-label="选择本地视频" type="file" accept="video/*"></label>
  <label for="opacity">底板不透明度<input id="opacity" type="range" min="70" max="96" value="82" step="1"><output id="opacity-value">82%</output></label>
</div>
<div class="controls"><button id="toggle" type="button">暂停</button><button id="restart" type="button">重播</button><input id="seek" aria-label="播放进度" type="range" min="0" max="6" step="0.01" value="0"><output id="time">0.0 / 6.0s</output></div>
<p class="caption" id="notice">画布透明，底板半透明；文字保持不透明。背景与控件只用于预览。<br>可以选择本地视频试叠，文件只在浏览器中读取，不上传。</p>
</main>
<script>
const frame=document.querySelector('iframe'),viewport=document.querySelector('.viewport'),seek=document.querySelector('#seek'),toggle=document.querySelector('#toggle'),time=document.querySelector('#time');
const footage=document.querySelector('#footage'),background=document.querySelector('#background'),opacity=document.querySelector('#opacity'),notice=document.querySelector('#notice');
let timeline,playing=true,position=0,last;
let videoURL;
function resize(){frame.style.transform=`scale(${viewport.clientWidth/1280})`;}
new ResizeObserver(resize).observe(viewport);resize();
function paint(){if(timeline)timeline.seek(position);seek.value=position;time.textContent=`${position.toFixed(1)} / 6.0s`;toggle.textContent=playing?'暂停':'播放';}
function applyOpacity(){frame.contentDocument?.documentElement.style.setProperty('--panel-alpha',Number(opacity.value)/100);document.querySelector('#opacity-value').textContent=opacity.value+'%';}
function syncFootage(force=false){
  if(background.value!=='video'||!footage.readyState||!Number.isFinite(footage.duration)||footage.duration<=0){footage.pause();return;}
  const target=Math.min(position,Math.max(0,footage.duration-1/30));
  if(force||Math.abs(footage.currentTime-target)>.25)footage.currentTime=target;
  const shouldPlay=playing&&position<footage.duration;
  if(shouldPlay&&footage.paused)footage.play().catch(()=>{notice.textContent='背景视频未能播放，请换一个浏览器支持的视频文件。';});
  if(!shouldPlay)footage.pause();
}
frame.addEventListener('load',()=>{timeline=frame.contentWindow.__timelines['material-summary'];applyOpacity();paint();});
toggle.addEventListener('click',()=>{if(position>=6)position=0;playing=!playing;paint();syncFootage(true);});
document.querySelector('#restart').addEventListener('click',()=>{position=0;playing=true;paint();syncFootage(true);});
seek.addEventListener('input',()=>{playing=false;position=Number(seek.value);paint();syncFootage(true);});
opacity.addEventListener('input',applyOpacity);
background.addEventListener('change',()=>{viewport.dataset.background=background.value;syncFootage(true);});
document.querySelector('#video-file').addEventListener('change',event=>{
  const file=event.target.files[0];if(!file)return;
  footage.pause();if(videoURL)URL.revokeObjectURL(videoURL);
  videoURL=URL.createObjectURL(file);footage.src=videoURL;
  background.querySelector('[value="video"]').disabled=false;background.value='video';viewport.dataset.background='video';
  position=0;playing=true;paint();notice.textContent='本地视频预览：'+file.name+'。视频仅在浏览器中读取，不上传；位置为固定下方排版。';
});
footage.addEventListener('loadedmetadata',()=>syncFootage(true));
footage.addEventListener('error',()=>{notice.textContent='这个视频无法解码，请换用浏览器支持的 MP4 或 WebM。';});
function tick(now){if(last!==undefined&&playing&&timeline){position=Math.min(6,position+(now-last)/1000);if(position===6)playing=false;paint();syncFootage();}last=now;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></body></html>
